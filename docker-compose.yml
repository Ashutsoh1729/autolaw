version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    environment:
      - AUTOLAW_DATABASE_URL=sqlite+aiosqlite:///./uploads/autolaw.db
      - AUTOLAW_UPLOAD_DIR=/app/uploads
      - AUTOLAW_TESSERACT_CMD=/usr/bin/tesseract
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # Placeholder: In production, use PostgreSQL instead of SQLite
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autolaw
      POSTGRES_USER: autolaw
      POSTGRES_PASSWORD: autolaw_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Placeholder for OCR service / vector store in Phase 2
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage

volumes:
  uploads:
  pgdata:
