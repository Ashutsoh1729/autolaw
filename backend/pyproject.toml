[project]
name = "autolaw-backend"
version = "0.1.0"
description = "AutoLaw - Legal AI Document Processing Pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.19",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-docx>=1.1.2",
    "fpdf2>=2.8.1",
    "pytesseract>=0.3.10",
    "Pillow>=11.1.0",
    "pypdf>=5.1.0",
    "pdf2image>=1.17.0",
    "rapidfuzz>=3.11.0",
    "python-dateutil>=2.9.0",
    "aiofiles>=24.1.0",
    "aioboto3>=13.2.0",
    "httpx>=0.28.1",
    "greenlet>=3.1",
    "pydantic-ai>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
]

[project.scripts]
autolaw = "app.main:start"
